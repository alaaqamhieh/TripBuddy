<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TripBuddy · Shenandoah Scenic Loop</title>
  <meta name="description" content="TripBuddy — your day trip, mapped in 3D with a timed itinerary." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <button id="panel-toggle" title="Show / hide itinerary">☰</button>

  <aside id="panel">
    <div class="panel-head">
      <div class="brand">TripBuddy</div>
      <h1 id="trip-title">Shenandoah Scenic Loop</h1>
      <div class="subtitle" id="trip-subtitle"></div>
      <div class="stats">
        <span class="stat"><b id="stat-dist">…</b></span>
        <span class="stat" id="stat-drive">calculating drive…</span>
        <span class="stat"><b>$30</b>/vehicle · 7 days</span>
      </div>
      <div class="actions">
        <button class="btn btn-gold" id="tour-btn">▶ Fly the route</button>
        <button class="btn" id="park-btn">Park close-up</button>
        <button class="btn" id="overview-btn">Full loop</button>
        <a class="btn" id="gmaps-btn" href="#" target="_blank" rel="noopener">Google Maps ↗</a>
      </div>
    </div>

    <div class="panel-scroll">
      <div class="section-label">Day plan — tap a stop to fly there</div>
      <ul id="itinerary"></ul>

      <div class="section-label">Pin legend</div>
      <div class="legend">
        <span><i style="background:#e4674f"></i> Hike</span>
        <span><i style="background:#6da8e8"></i> Overlook</span>
        <span><i style="background:#79c2a7"></i> Gate / visitor center</span>
        <span><i style="background:#d99ad4"></i> Food &amp; towns</span>
        <span><i style="background:#9aa5b1"></i> Alternate option</span>
      </div>

      <div class="section-label">Good to know</div>
      <ul id="notes"></ul>

      <div class="section-label">Researched from</div>
      <div id="sources"></div>
    </div>
  </aside>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="js/data/shenandoah.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
